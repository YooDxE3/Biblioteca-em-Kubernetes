apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: biblioteca-t3
  region: us-east-1
  version: "1.35"
availabilityZones: [us-east-1a, us-east-1b]
iam:
  withOIDC: true
vpc:
  nat:
    gateway: Disable
managedNodeGroups:
  - name: biblioteca-ng
    instanceType: t3.medium
    amiFamily: AmazonLinux2023
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 20
    volumeType: gp3
    privateNetworking: false
    ssh:
      allow: false
